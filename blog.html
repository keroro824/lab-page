<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #fdf7fb;
    --ink: #1a1320;
    --ink-soft: #4a3f55;
    --muted: #7a6f88;
    --line: #ebe2ee;
    --accent: #d96fae;
    --accent-2: #b76cd9;
    --accent-soft: #fde7f1;
    --gradient: linear-gradient(135deg, #f7b7d6 0%, #d96fae 45%, #b76cd9 100%);
    --shadow: 0 10px 40px -20px rgba(183, 108, 217, 0.35);
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink); background: var(--bg);
    line-height: 1.65; -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .container { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  /* nav */
  header.nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(160%) blur(12px);
    -webkit-backdrop-filter: saturate(160%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  header.nav {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid rgba(235, 226, 238, 0.7);
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }
  .brand {
    display: flex; align-items: center; gap: 12px;
    font-weight: 700; color: var(--ink); letter-spacing: -0.01em;
    transition: opacity 0.15s ease;
  }
  .brand:hover { opacity: 0.78; text-decoration: none; }
  .brand img { height: 32px; width: auto; display: block; }
  .brand span { font-size: 16.5px; }

  .nav-links { display: flex; align-items: center; gap: 4px; }
  .nav-links a {
    position: relative;
    color: var(--ink-soft); font-weight: 500; font-size: 14.5px;
    padding: 9px 14px; border-radius: 999px;
    transition: color 0.18s ease;
  }
  .nav-links a:not(.icon-link)::after {
    content: ""; position: absolute;
    left: 14px; right: 14px; bottom: 3px;
    height: 2px; border-radius: 2px;
    background: var(--gradient);
    opacity: 0; transform: scaleX(0.3); transform-origin: center;
    transition: opacity 0.2s ease, transform 0.25s ease;
  }
  .nav-links a:not(.icon-link):hover { color: var(--ink); text-decoration: none; }
  .nav-links a:not(.icon-link):hover::after { opacity: 1; transform: scaleX(1); }
  .nav-links a.active { color: var(--accent-2); }
  .nav-links a.active::after { opacity: 1; transform: scaleX(1); }

  .nav-links .icon-link {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; padding: 0;
    border-radius: 50%; color: var(--ink-soft);
    transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
  }
  .nav-links .icon-link:hover {
    background: var(--accent-soft); color: var(--accent-2);
    transform: translateY(-1px);
  }
  .nav-links .icon-link:first-of-type { margin-left: 12px; position: relative; }
  .nav-links .icon-link:first-of-type::before {
    content: ""; position: absolute;
    left: -7px; top: 50%; transform: translateY(-50%);
    width: 1px; height: 18px; background: var(--line);
  }

  .nav-toggle {
    display: none;
    align-items: center; justify-content: center;
    background: transparent; border: none;
    width: 40px; height: 40px;
    border-radius: 50%; cursor: pointer;
    color: var(--ink-soft);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .nav-toggle:hover { background: var(--accent-soft); color: var(--accent-2); }
  .nav-toggle .bars { transition: transform 0.25s ease, opacity 0.2s ease; transform-origin: center; }
  .nav-toggle[aria-expanded="true"] .bar1 { transform: translateY(5px) rotate(45deg); }
  .nav-toggle[aria-expanded="true"] .bar2 { opacity: 0; }
  .nav-toggle[aria-expanded="true"] .bar3 { transform: translateY(-5px) rotate(-45deg); }

  @media (max-width: 720px) {
    .nav-toggle { display: inline-flex; }

    .nav-links {
      position: absolute;
      top: 72px; left: 0; right: 0;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 0 24px;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 14px 30px -22px rgba(0,0,0,0.18);
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.3s ease, opacity 0.2s ease, padding 0.3s ease;
    }
    .nav-links.open {
      max-height: 640px;
      opacity: 1;
      padding: 12px 24px 18px;
    }
    .nav-links a:not(.icon-link) {
      display: block;
      padding: 12px 14px;
      border-radius: 10px;
    }
    .nav-links a:not(.icon-link)::after { display: none; }
    .nav-links a:not(.icon-link):hover { background: var(--bg-soft); }
    .nav-links a.active { background: var(--accent-soft); }

    .nav-links .icon-link {
      width: auto; height: auto;
      justify-content: flex-start;
      border-radius: 10px;
      background: transparent;
      margin-left: 0;
      padding: 12px 14px;
      gap: 12px;
    }
    .nav-links .icon-link::before { display: none; }
    .nav-links .icon-link::after {
      content: attr(aria-label);
      color: var(--ink-soft);
      font-size: 14.5px;
      font-weight: 500;
    }
    .nav-links .icon-link:first-of-type {
      margin-top: 6px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }
    .nav-links .icon-link:hover {
      background: var(--bg-soft);
      color: var(--accent-2);
      transform: none;
    }
  }

  /* page header */
  .page-head { padding: 80px 0 50px; position: relative; overflow: hidden; }
  .page-head::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(800px 400px at 90% -10%, rgba(217, 111, 174, 0.15), transparent 60%),
      radial-gradient(600px 300px at 0% 30%, rgba(183, 108, 217, 0.10), transparent 60%);
    pointer-events: none;
  }
  .page-head .container { position: relative; }
  .eyebrow {
    display: inline-block; font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent-2); font-weight: 600; margin-bottom: 14px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(34px, 4.4vw, 52px);
    line-height: 1.1; letter-spacing: -0.025em;
    margin: 0 0 16px; font-weight: 600;
  }
  .page-lede { color: var(--ink-soft); font-size: 17px; max-width: 60ch; margin: 0; }

  /* blog cards */
  main { padding: 0 0 100px; }
  .post-list {
    display: flex; flex-direction: column; gap: 22px;
  }
  .post {
    background: white;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 34px;
    transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.25s ease;
  }
  .post:hover {
    border-color: rgba(217, 111, 174, 0.4);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  @media (max-width: 600px) { .post { padding: 24px 22px; } }

  .post-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(22px, 2.4vw, 28px);
    font-weight: 600;
    margin: 0 0 12px;
    line-height: 1.25;
    letter-spacing: -0.015em;
  }
  .post-title a { color: var(--ink); }
  .post-title a:hover { color: var(--accent-2); text-decoration: none; }
  .post-title .ext {
    display: inline-block; margin-left: 4px; color: var(--muted);
    font-size: 0.7em; vertical-align: middle;
    transition: color 0.15s ease;
  }
  .post-title a:hover .ext { color: var(--accent-2); }

  .post-desc {
    color: var(--ink-soft);
    font-size: 15.5px;
    margin: 0 0 16px;
  }
  .post-authors {
    font-size: 13.5px;
    color: var(--muted);
    margin: 0 0 18px;
  }
  .post-links {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .post-link {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13.5px; font-weight: 500;
    background: var(--bg-soft);
    color: var(--ink);
    border: 1px solid var(--line);
    transition: all 0.15s ease;
  }
  .post-link:hover {
    background: var(--accent-soft);
    color: var(--accent-2);
    border-color: var(--accent);
    text-decoration: none;
  }
  .post-link.primary {
    background: var(--gradient);
    color: white;
    border-color: transparent;
  }
  .post-link.primary:hover { color: white; opacity: 0.92; }

  /* footer */
  footer {
    border-top: 1px solid var(--line);
    padding: 40px 0; color: var(--muted); font-size: 14px;
  }
  .footer-inner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
  }
  .footer-inner .brand img { height: 28px; }
  .footer-inner .brand span { font-size: 15px; }
  .footer-social { display: flex; gap: 10px; }
  .footer-social a {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%;
    color: var(--ink-soft); border: 1px solid var(--line);
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .footer-social a:hover { color: var(--accent-2); border-color: var(--accent); background: var(--accent-soft); }
</style>
</head>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

(function () {
  const toggle = document.querySelector('.nav-toggle');
  const menu = document.querySelector('.nav-links');
  if (!toggle || !menu) return;
  toggle.addEventListener('click', () => {
    const open = menu.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    menu.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  }));
})();

const POSTS = [
  {
    title: "Vortex: Democratizing Sparse Attention",
    description: "Vortex is a lightweight, modular framework for building custom sparse attention algorithms for LLM inference. It exists to make it easy for researchers and engineers to prototype, extend, and deploy advanced sparsity patterns on modern inference backends such as SGLang—without modifying core model code. Vortex allows you to express novel sparse attention concisely while relying on an optimized execution engine.",
    authors: "",
    paper: "https://github.com/Infini-AI-Lab/vortex_torch/",
    paperLabel: "GitHub",
    blog: "https://infini-ai-lab.github.io/ai-environment-architect/"

  {
    title: "Kinetics: Rethinking Test-Time Scaling Laws",
    description: "We introduce Kinetics, which challenges the traditional test-time scaling (TTS) laws by adopting a practical efficiency perspective. It reveals that prior compute-optimal approaches overlook major key-value memory access bottlenecks in various TTS strategies. By jointly considering memory and compute, the Kinetics scaling law shows that it is more efficient to scale model size up to a threshold before investing more compute in test-time scaling. Motivated by this, we propose a new scaling paradigm centered on sparse attention, which fundamentally reshapes the scaling law. According to our Sparse Kinetics scaling law, sparse attention significantly enhances the scalability and performance of TTS and becomes increasingly valuable in high-cost scenarios.",
    authors: "Ranajoy Sadhukhan, Zhuoming Chen, Haizhong Zheng, Yang Zhou, Emma Strubell, Beidi Chen",
    paper: "https://arxiv.org/abs/2506.05333",
    paperLabel: "arXiv",
    blog: "https://infini-ai-lab.github.io/Kinetics/"
  },
  {
    title: "Multiverse: Your Language Models Secretly Decide How to Parallelize and Merge Generation",
    description: "We introduce Multiverse, a new generative model that enables natively parallel generation. Multiverse internalizes a MapReduce paradigm through three stages: (i) a Map stage for adaptive task splitting, (ii) a Process stage for parallel subtask execution, and (iii) a Reduce stage for lossless result merging. Next, we build a real-world Multiverse model with a co-design of data, algorithm, and system, enabling rapid and seamless transfer from frontier AR-LLMs. For data creation, we develop Multiverse Curator, an automated LLM-assisted pipeline that transforms sequential chains into MapReduce structures. Algorithmically, we design Multiverse Attention to separate parallel steps while ensuring training efficiency. Systematically, we implement Multiverse Engine to dynamically switches between sequential and parallel generation. After a 3-hour fine-tuning with 1K examples, Multiverse-32B is the only open-sourced non-AR model to match the performance of leading AR-LLMs of the same scale, scoring 54% and 46% on AIME24 & 25, respectively. Moreover, it exhibits superior scaling, outperforming AR-LLMs by 1.87% on average, which results in up to a 2x speedup.",
    authors: "Xinyu Yang, Yuwei An, Hongyi Liu, Tianqi Chen, Beidi Chen",
    paper: "https://arxiv.org/pdf/2506.09991",
    paperLabel: "arXiv",
    blog: "https://multiverse4fm.github.io/"
  },
  {
    title: "GSM-Infinite: How Do Your LLMs Behave over Infinitely Increasing Context Length and Reasoning Complexity?",
    description: "We develop GSM-infinite, a grade-school math problem generator capable of producing arithmetic problems with infinite difficulty and context length under fine-grained control. GSM-infinite benchmark provides a scalable and controllable testbed for quantitatively evaluating and advancing LLM reasoning abilities with increasing reasoning difficulty and increasing context length. Specifically, we found these observations. 1. LLMs reasoning performance drops exponentially (sigmoid on realistic context) as reasoning complexity increases. 2. LLMs reasoning performance sharply decreases when context length increases. 3. LLMs consistently better at forward-thinking problems (constructive logic) than backward-thinking problems given the same reasoning complexity. 4. When we scale repeated sampling computation exponentially, LLM performance on GSM-infinite grows linearly.",
    authors: "Yang Zhou, Hongyi Liu, Zhuoming Chen, Yuandong Tian, Beidi Chen",
    paper: "https://arxiv.org/abs/2502.05252",
    paperLabel: "arXiv",
    blog: "https://infini-ai-lab.github.io/gsm_infinite/"
  },
  {
    title: "APE: Faster and Longer Context-Augmented Generation via Adaptive Parallel Encoding",
    description: "Context-augmented generation, including RAG and ICL, require the efficient combination of multiple contexts to generate responses. Directly inputting them sequentially increase computational cost by re-encoding the combined selection of contexts for every request. To address this, we propose Adaptive Parallel Encoding (APE) to pre-compute and cache the KV states of each context independently, enabling direct loading of cached states during inference and accommodating more contexts through position reuse across contexts. With the shared prefix, attention temperature, and scaling factor, APE further align the distribution of parallel encoding with sequential encoding for better accuracy. Our method can preserve 98% and 93% sequential encoding performance on RAG and ICL tasks, while achieving a 4.5× speedup by reducing 28× prefilling time for a 128K-length context.",
    authors: "Xinyu Yang, Tianqi Chen, Beidi Chen",
    paper: "https://arxiv.org/abs/2502.05431",
    paperLabel: "arXiv",
    blog: "https://infini-ai-lab.github.io/APE-Page/"

    authors: "Zhuoming Chen, Ranajoy Sadhukhan, Zihao Ye, Yang Zhou, Jianyu Zhang, Niklas Nolte, Yuandong Tian, Matthijs Douze, Leon Bottou, Zhihao Jia, Beidi Chen",

    paperLabel: "arXiv",
    blog: "https://www.lsh-ai.com"
  },
  {
    title: "S2FT: Efficient, Scalable and Generalizable LLM Fine-tuning by Structured Sparsity",
    description: "Structured Sparse Fine-Tuning (S2FT) is a novel PEFT family for LLMs that achieves high quality, efficient training, and scalable serving simultaneously. It accomplishes this by \"selecting sparsely and computing densely\". Compared to LoRA, S2FT enhances generalization ability on both commonsense and arithmetic reasoning with 4.6% and 1.3% average improvements while reducing 10% training time and memory. Furthermore, S2FT enables scalable effective fusion, fast switch, and efficient parallelism for serving multiple adapters. These features make S2FT particularly valuable for the large-scale, real-world deployment of foundation models in various domains.",

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

const EXT = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"/><polyline points="8 7 17 7 17 16"/></svg>';

function renderPost(p) {
  const titleHref = p.blog || p.paper || "";
  const titleHTML = titleHref
    ? `<a href="${esc(titleHref)}" target="_blank" rel="noopener">${esc(p.title)}<span class="ext"> ↗</span></a>`
    : esc(p.title);
  const authors = p.authors
    ? `<div class="post-authors">${esc(p.authors)}</div>`
    : "";
  const links = [];
  if (p.blog) {
    links.push(`<a class="post-link primary" href="${esc(p.blog)}" target="_blank" rel="noopener">Read blog ${EXT}</a>`);
  }
  if (p.paper) {
    links.push(`<a class="post-link" href="${esc(p.paper)}" target="_blank" rel="noopener">${esc(p.paperLabel || 'Paper')} ${EXT}</a>`);
  }
  return `
    <article class="post">
      <h2 class="post-title">${titleHTML}</h2>
      <p class="post-desc">${esc(p.description)}</p>
      ${authors}
      <div class="post-links">${links.join("")}</div>
    </article>
  `;
}

document.getElementById('postList').innerHTML = POSTS.map(renderPost).join("");
